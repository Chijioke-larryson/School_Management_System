{% extends "layout.html" %}

{% block title %}{{ title }} | Greenfield School{% endblock %}

{% block body %}
<section class="form-panel form-panel-wide">
    <p class="eyebrow">People</p>
    <h1>{{ title }}</h1>
    {% if title == "Add student" %}
        <p>The admission number becomes the initial username and password.</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="button" type="submit">Save student</button>
        <a class="button secondary-button" href="{% url 'students:student_list' %}">Cancel</a>
    </form>
</section>
{% endblock %}
