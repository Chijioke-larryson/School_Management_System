{% extends "layout.html" %}

{% block title %}{{ title }} | Greenfield School{% endblock %}

{% block body %}
<section class="form-panel">
    <p class="eyebrow">Academics</p>
    <h1>{{ title }}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="button" type="submit">Save class</button>
        <a class="button secondary-button" href="{% url 'academics:class_list' %}">Cancel</a>
    </form>
</section>
{% endblock %}
